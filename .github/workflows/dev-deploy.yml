name: Development Deployment

on:
  push:
    branches: [ "development" ]
  pull_request:
    branches: [ "development" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker registry
      uses: docker/login-action@v3
      with:
        registry: registry.pocapi.in
        username: ${{ secrets.REGISTRY_UNAME }}
        password: ${{ secrets.REGISTRY_PWD }}
        
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: registry.pocapi.in/infano.web:dev-latest
        build-args: |
          NEXT_PUBLIC_API_URL=http://109.199.120.104:8084/api
        cache-from: type=gha
        cache-to: type=gha,mode=max
        provenance: false

    - name: Copy docker-compose files
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SSH_SERVER_IP }}
        username: root
        password: ${{ secrets.SSH_SERVER_PWD }}
        port: 22
        source: "docker-compose.dev.yml,docker-compose.prod.yml"
        target: "/data/docker/infano-web-dev/"

    - name: deploy web to server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_SERVER_IP }}
        username: root
        password: ${{ secrets.SSH_SERVER_PWD }}
        port: 22
        script: |
          docker login registry.pocapi.in -u "${{ secrets.REGISTRY_UNAME }}" -p "${{ secrets.REGISTRY_PWD }}"
          docker pull registry.pocapi.in/infano.web:dev-latest
          mkdir -p /data/docker/infano-web-dev
          cd /data/docker/infano-web-dev
          
          # Ensure .env exists (should be managed on VPS)
          if [ ! -f .env ]; then
            touch .env
          fi
          
          docker compose -f docker-compose.dev.yml up -d
