services:
  dev-web:
    image: registry.infano.care/infano.web:dev-latest
    container_name: infano-web-dev
    restart: always
    ports:
      - "8086:3000"
    # Unified environment management via .env file on the VPS
    env_file:
      - .env
    networks:
      - portal_network
    environment:
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  portal_network:
    external: true
    name: docker_default
