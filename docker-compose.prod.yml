services:
  prod-web:
    image: registry.pocapi.in/infano.web:prod-latest
    container_name: infano-web-prod
    restart: always
    ports:
      - "8080:3000"
    # Unified environment management via .env file on the VPS
    env_file:
      - .env
    networks:
      - portal_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  portal_network:
    external: true
    name: docker_default
